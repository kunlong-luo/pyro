Please only use the templates above for bug reports and feature requests.

For everything else (help getting it to run on your fork, idea brainstorming,
showing off a cool customization you made, etc.) — start a
[Discussion](https://github.com/NianBroken/Firework_Simulator/discussions)
instead so the community can chip in!

If you are reporting a security concern, see the
[Security Policy](https://github.com/NianBroken/Firework_Simulator/blob/main/SECURITY.md)
and use the private disclosure channel.
